spring.application.name=employee-directory-api

# Local MySQL only. Override with environment variables; never commit real passwords.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_directory}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by db/schema.sql; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Exact Vite dev origin (no wildcard).
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:5173}

# Firebase ID-token verification on every request. Requires GOOGLE_APPLICATION_CREDENTIALS.
# Set APP_AUTH_ENABLED=false ONLY for local work before a Firebase project exists.
app.auth.enabled=${APP_AUTH_ENABLED:true}

server.error.include-stacktrace=never
server.error.include-message=never
